# E1 (#49), cells E and F: one-hot cross-entropy plus the risk loss on the joint-plain head, per group of
# boundary variants (spec §4.3). The risk term's EM weight gamma_r = r = 1, the same as MBR's gamma = 1
# (base.yaml). The runs added beta x the risk loss to the target loss (the old key risk_weight); that is
# (1 + beta) times the mix risk_share = beta / (1 + beta), so the swept grid beta {0.3, 1, 3} is risk_share
# {0.23, 0.5, 0.75} (slurm/e1_runs.sh) up to the loss scale. 0.5 here is the middle of the grid.
model: microsoft/deberta-v3-base
span_head: joint
length_bias: false
no_answer: true
target_unit: group
risk_share: 0.5
risk_em_weight: 1.0
