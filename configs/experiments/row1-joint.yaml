# Ladder row 1: Fajcik et al.'s joint objective (J), one softmax over all spans, frozen 2026-10-20 at the
# 1b freeze (#63) by the selection rule (plan §15.3): full W, no length bonus or position terms, no
# no-answer option, one-hot targets per group of boundary variants (target_unit group, the team's choice:
# the loss then counts the gold answer once, as the scorer does; E1's one-hot cells trained this way, but it
# was not compared head to head with span at these settings; on base with the no-answer option and the old
# windows, 1b-joint-plain (span) vs 1a-onehot (group), seeds 0-2, tie under MAP and MBR gains 0.34 EM+F1
# more over MAP with group). base.yaml's defaults are the rest of this setting; the keys below make it explicit.
# Two epochs, not the frozen recipe's one (added 2026-10-23, so the zero-initialized W trains longer):
# 2e-5 x 2 epochs has not run on large before, so the runs also score validation after epoch 1
# (--eval-each-epoch; that checkpoint has not annealed). Row 0 trained 1 epoch.
# Ladder row 2 (F1-weighted targets) was not adopted (E1, #61), and ladder row 3 is these runs decoded
# with MBR (gamma = 1), which every run reports next to MAP.
# Evidence, base, validation, MAP EM / F1:
#   row 0 standard head, 3 seeds (#59, old windows)       73.91 / 87.38
#   compound-plain, 3 seeds (#59, old windows)            74.18 / 87.38
#   joint-plain, no-answer on, 3 seeds (#63)              74.30 / 87.23
#   joint-plain, no-answer off, 3 seeds (#63)             74.62 / 87.55
#   diag 74.21 / 87.11, mlp 74.01 / 87.12, dot + rotary 74.42 / 87.23 (seed 0, #63)
# Runs: large, seeds 0-2, 8 windows per pass (fits an A100-40; about 22 min per epoch there):
#   soc.sh submit --gpus=flexible --time=01:30:00 --export=ALL,EXPERIMENT=row1-joint,SEED=<0|1|2> \
#     slurm/train_reader.sbatch --per-device-batch 8 --eval-each-epoch --save-each-epoch
#   --save-each-epoch keeps the epoch-1 model next to the checkpoint, as model_epoch1.pt (about 1.7 GB).
# A third epoch, continued from each seed's 2-epoch run (2026-10-23, continue_from in base.yaml): epoch 3
# starts at the learning rate a 3-epoch schedule has at step 4,974 (2e-5 x 2,487 / 6,715 = 7.4e-6), decaying to 0:
#   soc.sh submit --gpus=flexible --time=00:45:00 --export=ALL,EXPERIMENT=row1-joint,TAG=cont3,SEED=<s> \
#     slurm/train_reader.sbatch --per-device-batch 8 --set train.epochs=3 --set continue_from=<run id>
#   run ids: s0 2026-10-23-row1-joint-s0-j998373, s1 2026-10-23-row1-joint-s1-j998384, s2 2026-10-23-row1-joint-s2-j998397
#   Outcome (jobs 1001209, 1001274, 1001301): worse than stopping at 2 epochs on every seed, MAP 76.44 / 89.22 vs
#   76.97 / 89.46, EM + F1 -0.77 [-1.13, -0.40] (MBR -0.79 [-1.16, -0.43]); T 1.29 -> 1.43. Row 1 stays at 2 epochs.
span_head: joint
bilinear_form: full
bilinear_pos: none
length_bias: false
no_answer: false
target_unit: group
f1_target_weight: 0.0
risk_share: 0.0
train:
  epochs: 2
